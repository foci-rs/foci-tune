[advisories]
version = 2
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but only reaches us through nalgebra via simba; no safe upgrade exists" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/foci-rs/foci-trace"]
