[package]
name = "foci-tune"
description = "Moonraker-attached FOCI tuning service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
foci-tune-analysis = { path = "../foci-tune-analysis" }
foci-trace = { git = "https://github.com/foci-rs/foci-trace" }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
structured-zstd = "=0.2.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand = "0.10.3"
futures-util = "0.3.34"
bytes = "1.11.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
