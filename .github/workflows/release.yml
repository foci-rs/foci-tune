name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            cc: arm-linux-gnueabihf-gcc
            apt: gcc-arm-linux-gnueabihf
          - target: aarch64-unknown-linux-musl
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            cc: gcc
            apt: musl-tools
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.92
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build release binary
        run: |
          export "CC_$(echo '${{ matrix.target }}' | tr - _)=${{ matrix.cc }}"
          cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: foci-tune-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/foci-tune

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: armv7 under qemu
        run: |
          chmod +x artifacts/foci-tune-armv7-unknown-linux-musleabihf/foci-tune
          qemu-arm-static artifacts/foci-tune-armv7-unknown-linux-musleabihf/foci-tune --check
      - name: aarch64 under qemu
        run: |
          chmod +x artifacts/foci-tune-aarch64-unknown-linux-musl/foci-tune
          qemu-aarch64-static artifacts/foci-tune-aarch64-unknown-linux-musl/foci-tune --check
      - name: x86_64 native
        run: |
          chmod +x artifacts/foci-tune-x86_64-unknown-linux-musl/foci-tune
          artifacts/foci-tune-x86_64-unknown-linux-musl/foci-tune --check

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/package-release.sh artifacts dist
          make installer
          gh release create "$TAG" dist/* build/foci-tune-installer.sh build/foci-tune-installer.sh.sha256 --title "$TAG" --notes-file CHANGES.md
