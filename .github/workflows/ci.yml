name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm test
      - run: npm run build

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - run: shellcheck installer/installer.sh scripts/package-release.sh install.sh
      - run: bats installer/tests scripts/tests install_test.bats

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            cc: arm-linux-gnueabihf-gcc
            apt: gcc-arm-linux-gnueabihf
          - target: aarch64-unknown-linux-musl
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            cc: gcc
            apt: musl-tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build release binary
        run: |
          export "CC_$(echo '${{ matrix.target }}' | tr - _)=${{ matrix.cc }}"
          cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foci-tune-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/foci-tune

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: armv7 under qemu
        run: |
          chmod +x artifacts/foci-tune-armv7-unknown-linux-musleabihf/foci-tune
          qemu-arm-static artifacts/foci-tune-armv7-unknown-linux-musleabihf/foci-tune --check
      - name: aarch64 under qemu
        run: |
          chmod +x artifacts/foci-tune-aarch64-unknown-linux-musl/foci-tune
          qemu-aarch64-static artifacts/foci-tune-aarch64-unknown-linux-musl/foci-tune --check
      - name: x86_64 native
        run: |
          chmod +x artifacts/foci-tune-x86_64-unknown-linux-musl/foci-tune
          artifacts/foci-tune-x86_64-unknown-linux-musl/foci-tune --check
