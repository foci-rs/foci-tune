[workspace]
members = ["crates/foci-tune-analysis", "crates/foci-tune"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/foci-rs/foci-tune"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package.foci-tune-analysis]
opt-level = 3

[profile.dev.package.levenberg-marquardt]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3
